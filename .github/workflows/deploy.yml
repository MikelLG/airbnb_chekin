name: Deploy Check-in Portal

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API key
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 -c "
          import os
          key = os.environ['API_KEY']
          with open('index.html', 'r') as f:
              content = f.read()
          content = content.replace('__ANTHROPIC_API_KEY__', key)
          with open('index.html', 'w') as f:
              f.write(content)
          print('Key injected successfully')
          "

      - name: Verify injection
        run: |
          if grep -q '__ANTHROPIC_API_KEY__' index.html; then
            echo "ERROR: placeholder still present!"
            exit 1
          else
            echo "OK: key injected correctly"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
